<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Marketplace Deck — BuyIt</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">    <link rel="stylesheet" href="./css/admin.css">
<script src="./js/admin/storage.js" defer></script>
<script src="./js/admin/security.js" defer></script>
<script src="./js/admin/toast.js" defer></script>
<script src="./js/admin/modal.js" defer></script>
<script src="./js/admin/utils.js" defer></script>
<script src="./js/admin/ui.js" defer></script>
<script src="./js/admin/admin.js" defer></script>
</head>
<body>
    <div class="design">
       <!-- DEDICATED MANAGEMENT UTILITY TOPBAR -->
<header class="admin-topbar">
    <div class="topbar-left">
        <span class="admin-brand">
            <i class="fa-solid fa-gauge-high"></i> BuyIt <span class="badge">Console</span>
        </span>
    </div>
    <div><ul> <li><a href="index.html">Home</a></li></ul></div>
    <div class="topbar-right">
        <div class="operator-profile">
            <i class="fa-solid fa-user-shield"></i>
            <span id="active-operator-label" class="operator-name">Secured Node</span>
        </div>
        <button id="admin-logout-topbar" class="admin-logout-btn" title="Terminate Secure Session">
            <i class="fa-solid fa-right-from-bracket"></i> Clear Session
        </button>
    </div>
</header>
        <div class="nav-overlay" id="nav-overlay"></div>

        <main class="admin-container">
            <aside class="admin-sidebar">
                <div class="admin-title-card">
                    <div id="admin-profile-card"></div>
                    <i class="fa-solid fa-sliders-span admin-icon"></i>
                    <h2>Admin Console</h2>
                    <p>Marketplace Overview</p>
                     <span id="admin-status">
🟢 Online
</span>
                </div>
              <nav class="admin-menu" aria-label="Admin console navigation">
    <button class="admin-menu-item active" id="tab-analytics">
        <i class="fa-solid fa-chart-pie"></i><span>Analytics</span>
    </button>
    <button class="admin-menu-item" id="tab-products">
        <i class="fa-solid fa-boxes-stacked"></i><span>Inventory</span>
    </button>
    <button class="admin-menu-item" id="tab-orders">
        <i class="fa-solid fa-receipt"></i><span>Orders</span>
    </button>
    <button class="admin-menu-item" id="tab-activity">
        <i class="fa-solid fa-clock-rotate-left"></i><span>Activity</span>
    </button>
    
    <button class="admin-menu-item" id="tab-settings">
        <i class="fa-solid fa-user-gear"></i><span>Settings</span>
    </button>

    <button class="admin-menu-item logout-admin-btn" id="admin-logout-sidebar">
        <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
    </button>
</nav> 
            </aside>

            <section class="admin-content">
                <div class="admin-stats-strip">
                    <div class="astat-card">
                        <span class="astat-num" id="adm-total-sales">₦0</span>
                        <span class="astat-label">Gross Revenue</span>
                    </div>
                    <div class="astat-card">
                        <span class="astat-num" id="adm-total-orders">0</span>
                        <span class="astat-label">Total Transactions</span>
                    </div>
                    <div class="astat-card">
                        <span class="astat-num" id="adm-total-products">0</span>
                        <span class="astat-label">Registered Skus</span>
                    </div>
                </div>

                <div id="admin-main-pane">
                    </div>
            </section>
        </main>

      <div class="admin-modal" id="product-modal">
            <div class="amodal-card">
                <h3 id="modal-action-title">Add New Product SKU</h3>
                <form id="product-modal-form">
                    <input type="hidden" id="edit-product-id">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="prod-name" required placeholder="e.g., Organic Bananas Pack">
                    </div>
                    <div class="form-group">
                        <label>Price (Naira Number Value Only)</label>
                        <input type="number" id="prod-price" required min="0" placeholder="e.g., 2500">
                    </div>
                    <div class="form-group">
                        <label>SKU / Product ID</label>
                        <input type="text" id="prod-sku" placeholder="Leave blank to auto-generate">
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="prod-stock" min="0" value="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Product Type</label>
                        <select id="prod-type">
                            <option value="custom">Custom Product</option>
                            <option value="base">Base Product</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display:flex; align-items:center; gap:8px; font-weight:600;">
                            <input type="checkbox" id="prod-featured"> Featured Product
                        </label>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="prod-description" rows="3" placeholder="Optional description"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Product Image Source</label>
                        <input type="file" id="prod-img-file" accept="image/*" style="margin-bottom: 8px; width: 100%;">
                        <div style="text-align: center; margin: 4px 0; color: #64748b; font-size: 0.8rem; font-weight: 600;">— OR —</div>
                        <input type="url" id="prod-img" placeholder="https://images.unsplash.com/... (Optional if file uploaded)">
                    </div>

                   <div class="form-group">
    <label>Target Marketplace File Page Category Location</label>
    <select id="prod-category">
        <option value="fresh">Fresh Produce</option>
        <option value="meat_seafood">Meat & Seafood</option>
        <option value="dairy_eggs">Dairy & Eggs</option>
        <option value="bakery">Bakery</option>
        <option value="beverages">Beverages</option>
        <option value="snacks">Snacks & Confectionery</option>
        <option value="frozen_foods">Frozen Foods</option>
        <option value="canned_packaged">Canned & Packaged Foods</option>
        <option value="cereals_breakfast">Cereals & Breakfast</option>
        <option value="condiments_spices">Condiments & Spices</option>

        <option value="personal_care_hygiene">Personal Care</option>
        <option value="household_cleaning">Household & Cleaning</option>
        <option value="baby_products">Baby Products</option>
        <option value="pet_supplies">Pet Supplies</option>
        <option value="health_wellness">Health & Wellness</option>

        <option value="phones">Electronics & Gadgets</option>
        <option value="wears">Clothing & Accessories</option>
        <option value="home_ele">Home Appliances</option>
        <option value="kitchen">Kitchen Utensils</option>
        <option value="stationery_office">Stationery & Office</option>
        <option value="automobile">Automotive</option>
        <option value="sports_outdoors">Sports & Outdoors</option>
        <option value="toys_games">Toys & Games</option>
    </select>
</div>

                    <div class="form-group" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #e2e8f0;">
                        <label style="color: #ef4444; font-weight: bold;"><i class="fa-solid fa-lock"></i> Confirm Admin Password</label>
                        <input type="password" id="prod-admin-auth" required placeholder="Enter your login password to authorize">
                    </div>

                    <div class="amodal-actions">
                        <button type="button" class="acancel-btn" id="close-pmodal-btn">Dismiss</button>
                        <button type="submit" class="asave-btn">Commit Changes</button>
                    </div>
                </form>
            </div>
        </div> 

        <!-- SYSTEM CONTROL FOOTNOTE -->
<footer class="admin-system-footer">
    <div class="footer-content">
        <p>&copy; 2026 BuyIt Ledger System &bull; Operational Control Instance &bull; Vercel Secure Node Deployment</p>
        <div class="system-status">
            <span class="status-indicator-dot"></span>
            <span class="status-text">All Systems Operational</span>
        </div>
    </div>
</footer>
    </div>
</body>
</html>
