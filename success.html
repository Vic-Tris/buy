<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Successful — BuyIt</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/success.css">

<script src="./js/main.js" defer></script>
<script src="./js/success.js" defer></script>

</head>
<body>

<div class="design">

<header class="site-header" id="global-header"></header>
<div class="nav-overlay" id="nav-overlay"></div>

<section class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>Order Successful!</h1>

        <p>
            Thank you for shopping with BuyIt.
        </p>

        <div class="order-info">

            <div class="info-row">
                <span>Order Number</span>
                <strong id="order-id"></strong>
            </div>

            <div class="info-row">
                <span>Customer</span>
                <strong id="customer-name"></strong>
            </div>

            <div class="info-row">
                <span>Payment Method</span>
                <strong id="payment-method"></strong>
            </div>

            <div class="info-row total-row">
                <span>Total Paid</span>
                <strong id="order-total"></strong>
            </div>

        </div>

        <a href="index.html" class="continue-btn">
            Continue Shopping
        </a>

    </div>

</section>

<footer id="global-footer"></footer>

</div>

</body>
</html>
