<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — BuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/auth.js?v=2" defer></script>
    <script src="./js/main.js?v=2" defer></script>
</head>
<body>
  <div class="design">

    <header class="site-header" id="global-header"></header>
    <div class="nav-overlay" id="nav-overlay"></div>

    <div class="auth-container">
      <div class="auth-form">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to your account</p>
        
        <form  id="login-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>
          
          <button type="submit" class="auth-btn">Log In</button>
        </form>
        
        <p id="login-error-msg" style="color: #dc2626; font-size: 0.9rem; margin-top: 15px; text-align: center; display: none;"></p>

        <p class="auth-switch">
          First time user? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>

    <footer id="global-footer"></footer>
  </div>
</body>
</html>
