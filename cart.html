<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — BuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/stle.css">
    <script src="./js/main.js" defer></script>
</head>
<body>
  <div class="design">

    <!-- Header -->
    <header class="site-header" id="global-header"></header>
<div class="nav-overlay" id="nav-overlay"></div>
<div class="nav-overlay" id="nav-overlay"></div>
    <!-- Cart Content -->
    <div class="cart-container">
      <h1><i class="fa-solid fa-cart-shopping"></i> Your Cart</h1>

      <div id="cart-empty" class="cart-empty" style="display:none;">
        <i class="fa-solid fa-cart-shopping"></i>
        <p>Your cart is empty</p>
        <a href="index.html">Start Shopping</a>
      </div>

      <div id="cart-items" class="cart-items" style="display:none;"></div>

      <div id="cart-summary" class="cart-summary" style="display:none;">
        <div class="cart-summary-row">
          <span>Items</span>
          <span id="cart-count">0</span>
        </div>
        <div class="cart-summary-row total">
          <span>Total</span>
          <span id="cart-total">#0</span>
        </div>
        <button class="checkout-btn" id="checkout-btn">
          <i class="fa-solid fa-lock"></i> Proceed to Checkout
        </button>
      </div>
    </div>

    <!-- Footer -->
   <id="global-footer"></footer> 

<footer id="global-footer"></footer>
  </div>
</body>
</html>
