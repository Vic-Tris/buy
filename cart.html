<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — BuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./success.css">
    <link rel="stylesheet" href="./css/checkout.css">
    <link rel="stylesheet" href="./css/cart.css">
    <script src="./js/main.js" defer></script>
    <script src="./js/cart.js" defer></script> 
</head>
<body>
  <div class="design">

    <header class="site-header" id="global-header"></header>
    <div class="nav-overlay" id="nav-overlay"></div>
    
    <div class="cart-container">
      <h1><i class="fa-solid fa-cart-shopping"></i> Your Cart</h1>

      <div id="cart-empty" class="cart-empty" style="display:none;">
        <i class="fa-solid fa-cart-shopping"></i>
        <p>Your cart is empty</p>
        <a href="categories.html">Start Shopping</a>
      </div>

      <div id="cart-active-wrapper" style="display:none;">
         <div id="cart-items" class="cart-items"></div>

         <div id="cart-summary" class="cart-summary">
           <h3>Order Summary</h3>
           <div class="cart-summary-row">
             <span>Items Count</span>
             <span id="cart-count">0</span>
           </div>
           <div class="cart-summary-row">
             <span>Subtotal</span>
             <span id="cart-page-subtotal">$0.00</span>
           </div>
           <div class="cart-summary-row" id="cart-page-discount-row" style="display: none; color: green;">
             <span>Discount Code Applied</span>
             <span id="cart-page-discount">-$0.00</span>
           </div>
           
           <div class="page-promo-box">
             <input type="text" id="cart-page-promo-input" placeholder="Promo code (SAVE10, SUPERBUY)">
             <button id="cart-page-promo-btn">Apply</button>
           </div>
           <div id="cart-page-promo-msg" style="font-size: 0.85rem; margin-top: 5px;"></div>
           
           <div class="cart-summary-row total">
             <span>Grand Total</span>
             <span id="cart-total">$0.00</span>
           </div>
           <button class="checkout-btn" id="checkout-btn">
             <i class="fa-solid fa-lock"></i> Proceed to Checkout
           </button>
         </div>
      </div>
    </div>

    <footer id="global-footer"></footer> 
  </div>
  <script src="./js/checkout.js" defer></script>
</body>
</html>
