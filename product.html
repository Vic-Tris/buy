<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Produce — BuyIt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js?v=2" defer></script>
</head>
<body>
  <div class="design">

    <header class="site-header" id="global-header"></header>
    <div class="nav-overlay" id="nav-overlay"></div>

    <section class="product_page">
        <div class="product_gallery">
            <img id="product-image" src="" alt="">
        </div>

        <div class="product_details">
            <h1 id="product-name"></h1>

            <div class="rating">
                ★★★★★ <span>4.9 Rating</span>
            </div>

            <h2 id="product-price"></h2>

            <p id="product-description"></p>

            <div class="stock">
                <i class="fa-solid fa-circle-check"></i>
                In Stock
            </div>

            <div class="actions">
                <button class="add-cart" id="add-to-cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i> Add To Cart
                </button>

                <button class="buy-now" id="buy-now-btn">
                    Buy Now
                </button>
            </div>
        </div>
    </section>

    <footer id="global-footer"></footer> 
  </div> <script src="./js/product.js" defer></script>
</body>
</html>
